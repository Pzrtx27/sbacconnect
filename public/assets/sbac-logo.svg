<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" fill="none">
  <!-- SBAC Triangle Logo - Transparent Background -->
  <defs>
    <linearGradient id="blueGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3cc8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f1d5e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c8102e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e11d48;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main inverted triangle -->
  <polygon points="100,210 10,30 190,30" fill="url(#blueGrad)" />
  
  <!-- Red horizontal stripes in lower portion -->
  <g clip-path="url(#triClip)">
    <rect x="35" y="110" width="130" height="6" rx="1" fill="#c8102e" opacity="0.9"/>
    <rect x="40" y="120" width="120" height="6" rx="1" fill="#c8102e" opacity="0.9"/>
    <rect x="45" y="130" width="110" height="6" rx="1" fill="#c8102e" opacity="0.85"/>
    <rect x="50" y="140" width="100" height="6" rx="1" fill="#c8102e" opacity="0.85"/>
    <rect x="55" y="150" width="90" height="6" rx="1" fill="#c8102e" opacity="0.8"/>
    <rect x="60" y="160" width="80" height="6" rx="1" fill="#c8102e" opacity="0.8"/>
    <rect x="65" y="170" width="70" height="6" rx="1" fill="#c8102e" opacity="0.75"/>
    <rect x="72" y="180" width="56" height="6" rx="1" fill="#c8102e" opacity="0.75"/>
    <rect x="80" y="190" width="40" height="5" rx="1" fill="#c8102e" opacity="0.7"/>
  </g>
  
  <!-- Inner blue triangle (mountain shape) -->
  <polygon points="100,105 60,80 80,80" fill="#1a3cc8" opacity="0.6"/>
  <polygon points="100,55 65,100 135,100" fill="url(#blueGrad)" opacity="0.5"/>
  
  <!-- SBAC Text -->
  <text x="100" y="78" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="900" fill="#ffffff" letter-spacing="4">SBAC</text>
  
  <!-- Clip path for stripes -->
  <defs>
    <clipPath id="triClip">
      <polygon points="100,210 10,30 190,30"/>
    </clipPath>
  </defs>
</svg>
